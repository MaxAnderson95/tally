name: CI

on:
  push:
    branches: ['**']
    paths:
      - '.github/workflows/**'
      - 'Package.swift'
      - 'Package.resolved'
      - 'Sources/**'
      - 'Tests/**'
      - 'scripts/**'
      - 'assets/**'
      - 'web/**'
      - 'companion/**'
      - '!**/*.md'
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'Package.swift'
      - 'Package.resolved'
      - 'Sources/**'
      - 'Tests/**'
      - 'scripts/**'
      - 'assets/**'
      - 'web/**'
      - 'companion/**'
      - '!**/*.md'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  web-and-companion:
    name: Web and companion checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Check shell syntax
        run: |
          for script in scripts/*.sh; do
            bash -n "$script"
          done

      - name: Install web dependencies
        run: npm --prefix web ci

      - name: Test web
        run: npm --prefix web test

      - name: Typecheck and build web
        run: npm --prefix web run build

      - name: Install companion dependencies
        run: npm --prefix companion ci

      - name: Test companion
        run: npm --prefix companion test

      - name: Typecheck and build companion
        run: npm --prefix companion run build

  macos:
    name: Swift tests and app bundle
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Test Swift
        run: |
          swift --version
          bash scripts/test-swift.sh

      - name: Build and verify app bundle
        run: |
          bash scripts/build-app.sh
          codesign --verify --deep --strict build/Tally.app
