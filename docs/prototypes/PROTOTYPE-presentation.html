<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tally presentation prototype (throwaway)</title>
<!--
  PROTOTYPE, THROWAWAY. Three layout variants (A Ledger, B Cards, C Table) of Tally's
  menu bar pins, popover, and mobile overview, switchable via ?variant=A|B|C.
  Resolves https://github.com/MaxAnderson95/tally/issues/12. Synthetic data only.
  Provider logos are fetched once from models.dev (the source OpenChamber uses) and inlined.
-->
<style>
  /* ---------- design tokens ---------- */
  :root {
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", system-ui, sans-serif;
    --ink: #1d1d1f; --ink-2: #6e6e73; --ink-3: #a1a1a6;
    --paper: #f5f5f7; --paper-2: #ffffff; --rule: rgba(0,0,0,.09);
    --track: rgba(0,0,0,.09); --fill: #1d1d1f;
    --hover: rgba(0,0,0,.04); --press: rgba(0,0,0,.08);
    --accent: #1d1d1f; --on-accent: #fff;
    --warn-bg: rgba(0,0,0,.05);
    --radius: 10px;
  }
  .dark {
    --ink: #f5f5f7; --ink-2: #a1a1a6; --ink-3: #6e6e73;
    --paper: #1c1c1e; --paper-2: #2c2c2e; --rule: rgba(255,255,255,.1);
    --track: rgba(255,255,255,.14); --fill: #f5f5f7;
    --hover: rgba(255,255,255,.05); --press: rgba(255,255,255,.1);
    --accent: #f5f5f7; --on-accent: #1c1c1e;
    --warn-bg: rgba(255,255,255,.07);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: var(--font); font-size: 13px; line-height: 1.35; color: #1d1d1f;
    background: #d9d9de; padding: 24px 300px 120px 24px; font-variant-numeric: tabular-nums;
    -webkit-font-smoothing: antialiased;
  }
  @media (max-width: 1100px) { body { padding-right: 24px; } #proto-controls { position: static; width: auto; margin-bottom: 16px; } }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  button:focus-visible, [tabindex]:focus-visible { outline: 2px solid #2456e6; outline-offset: 2px; border-radius: 4px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

  /* ---------- stage layout ---------- */
  #stage { max-width: 1180px; margin: 0 auto; }
  .stage-note { color: #3a3a3c; margin: 0 0 14px; max-width: 70ch; }
  .menubars { display: grid; gap: 8px; margin-bottom: 26px; }
  .surfaces { display: grid; grid-template-columns: auto auto; gap: 40px; justify-content: start; align-items: start; }
  @media (max-width: 860px) { .surfaces { grid-template-columns: 1fr; } }
  .surface-label { color: #3a3a3c; margin: 0 0 8px; font-size: 12px; }

  /* ---------- menu bar ---------- */
  .menubar {
    height: 24px; display: flex; align-items: center; justify-content: flex-end; padding: 0 12px;
    font-size: 12px; font-weight: 500; border-radius: 6px; letter-spacing: 0;
    box-shadow: 0 1px 0 rgba(0,0,0,.08);
  }
  .menubar.light { background: linear-gradient(#f7f7f9, #ececf0); color: #1d1d1f; }
  .menubar.dark  { background: linear-gradient(#2a2a2d, #202023); color: #f5f5f7; }
  .menubar .sys { display: flex; gap: 14px; margin-left: 14px; opacity: .85; }
  .pins { display: flex; gap: 0; align-items: center; height: 100%; }
  .pin {
    display: flex; align-items: center; gap: 3px; height: 100%; padding: 0 4px; position: relative;
    border-radius: 4px; cursor: default; margin-left: 2px;
  }
  .pin:hover { background: rgba(127,127,127,.18); }
  .pin .logo { display: inline-flex; }
  .pin svg { width: 15px; height: 15px; display: block; }
  .provider-head svg, .pn svg, .ppill svg { width: 12px; height: 12px; }
  .pin .pct { text-align: left; }
  .pin .pct.stack { display: flex; flex-direction: column; font-size: 9.5px; line-height: 1.05; font-weight: 600; letter-spacing: -.01em; }
  .pin .pct.unknown { font-weight: 600; }
  .pin .warn { width: 10px; height: 10px; margin-left: -1px; }
  .pin .id-underline { position: absolute; left: 6px; right: 6px; bottom: 2px; height: 2px; border-radius: 1px; }
  .pin .id-dot { width: 6px; height: 6px; border-radius: 50%; flex: none; }
  .pin.tally-only svg { width: 14px; height: 14px; }
  .tip {
    position: fixed; z-index: 50; pointer-events: none; background: #1d1d1f; color: #fff;
    padding: 5px 8px; border-radius: 6px; font-size: 12px; max-width: 320px; white-space: nowrap;
    box-shadow: 0 4px 16px rgba(0,0,0,.25); display: none;
  }

  /* ---------- popover frame ---------- */
  .popover {
    width: 360px; background: var(--paper); color: var(--ink); border-radius: 12px; position: relative;
    box-shadow: 0 0 0 .5px rgba(0,0,0,.2), 0 10px 30px rgba(0,0,0,.25); overflow: hidden;
  }
  .popover.wide { width: 440px; }
  .popover.clipped .body { max-height: 720px; overflow: auto; }
  .phone {
    width: 390px; height: 780px; background: var(--paper); color: var(--ink); border-radius: 44px; position: relative;
    box-shadow: 0 0 0 10px #111, 0 0 0 12px #333, 0 20px 40px rgba(0,0,0,.35); overflow: hidden;
  }
  .phone.narrow { width: 320px; height: 680px; }
  .phone .body { position: absolute; inset: 0; overflow: auto; padding-top: 54px; padding-bottom: 28px; }
  .phone .statusbar { position: absolute; top: 0; left: 0; right: 0; height: 54px; display: flex; align-items: flex-end; justify-content: space-between; padding: 0 30px 8px; font-size: 15px; font-weight: 600; pointer-events: none; z-index: 2; }
  .phone .home { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 130px; height: 5px; border-radius: 3px; background: var(--ink); opacity: .7; }

  /* ---------- desktop browser frame ---------- */
  .browser { background: var(--paper); color: var(--ink); border-radius: 10px; position: relative; overflow: hidden; box-shadow: 0 0 0 .5px rgba(0,0,0,.25), 0 14px 40px rgba(0,0,0,.25); }
  .browser .chrome { height: 38px; display: flex; align-items: center; gap: 7px; padding: 0 14px; background: var(--paper-2); border-bottom: 1px solid var(--rule); }
  .browser .chrome > span { width: 11px; height: 11px; border-radius: 50%; background: var(--ink-3); opacity: .5; }
  .browser .chrome .url { margin-left: 14px; flex: 1; max-width: 420px; height: 24px; border-radius: 6px; background: var(--track); font-size: 12px; color: var(--ink-2); display: flex; align-items: center; justify-content: center; }
  .browser .page { padding: 10px 0 24px; }
  .browser .hdr { padding: 12px 28px 12px; }
  .browser .hdr h1 { font-size: 22px; letter-spacing: -.02em; }
  .browser .overlay { max-width: 520px; left: auto; right: 0; box-shadow: -8px 0 30px rgba(0,0,0,.15); border-left: 1px solid var(--rule); }
  .desk { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 0 28px; padding: 0 14px; align-items: start; }
  .desk-activity { position: sticky; top: 0; }
  .A.desk .desk-accounts { columns: 2; column-gap: 24px; }
  .A.desk .acct { break-inside: avoid; }
  .A.desk .section-title, .A.desk .provider-head { column-span: all; }
  .B.desk { grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); }
  .B.desk .desk-accounts { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; align-content: start; }
  .B.desk .desk-accounts .section-title, .B.desk .desk-accounts .provider-head { grid-column: 1 / -1; padding-bottom: 0; }
  .B.desk .card { margin: 0; }
  .B.desk .act.card { margin: 34px 0 0; }
  .C.desk { grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); }
  .C.desk td.reset { max-width: none; }

  /* ---------- shared bits inside surfaces ---------- */
  .hdr { display: flex; align-items: baseline; justify-content: space-between; padding: 12px 14px 8px; }
  .hdr h1 { font-size: 15px; margin: 0; font-weight: 600; letter-spacing: -.01em; }
  .hdr .meta { color: var(--ink-2); font-size: 12px; display: flex; gap: 10px; align-items: baseline; }
  .hdr .meta button { color: var(--ink); text-decoration: underline; text-underline-offset: 2px; text-decoration-color: var(--ink-3); }
  .phone .hdr { padding: 6px 20px 10px; }
  .phone .hdr h1 { font-size: 26px; letter-spacing: -.02em; }
  .section-title { padding: 12px 14px 4px; color: var(--ink-2); font-size: 12px; font-weight: 500; }
  .phone .section-title { padding: 14px 20px 6px; font-size: 13px; }
  .provider-head { display: flex; align-items: center; gap: 6px; padding: 8px 14px 2px; color: var(--ink-2); font-size: 12px; }
  .phone .provider-head { padding: 10px 20px 2px; }
  .provider-head svg { width: 11px; height: 11px; }
  .bar { height: 4px; background: var(--track); border-radius: 2px; position: relative; overflow: hidden; }
  .bar > i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--fill); border-radius: 2px; }
  .bar.unknown { background: repeating-linear-gradient(90deg, var(--track) 0 3px, transparent 3px 6px); }
  .bar.zero > i { width: 0; }
  .pct-big { font-weight: 600; letter-spacing: -.01em; }
  .muted { color: var(--ink-2); }
  .faint { color: var(--ink-3); }
  .warnmark { display: inline-flex; align-items: center; gap: 4px; color: var(--ink); }
  .warnmark svg { width: 12px; height: 12px; flex: none; }
  .chip {
    display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 999px;
    border: 1px solid var(--rule); font-size: 12px; color: var(--ink); background: var(--paper-2);
  }
  .chip svg { width: 12px; height: 12px; flex: none; }
  .chip.action:hover { background: var(--hover); }
  .chip.warn { background: var(--warn-bg); border-color: transparent; font-weight: 500; }
  .acct-logo { display: inline-flex; flex: none; }
  .acct-logo svg { width: 16px; height: 16px; }
  .phone .acct-logo svg { width: 18px; height: 18px; }
  .rule { height: 1px; background: var(--rule); margin: 6px 14px; }
  .phone .rule { margin: 6px 20px; }
  .details { padding: 4px 14px 10px 14px; font-size: 12px; color: var(--ink-2); }
  .phone .details { padding: 4px 20px 12px; font-size: 13px; }
  .details dl { display: grid; grid-template-columns: auto 1fr; gap: 3px 16px; margin: 6px 0 0; }
  .details dt { color: var(--ink-3); text-align: left; }
  .details dd { margin: 0; color: var(--ink-2); text-align: right; }
  .details .sub { margin-top: 8px; color: var(--ink); font-weight: 500; }
  .textbtn { color: var(--ink); text-decoration: underline; text-underline-offset: 2px; text-decoration-color: var(--ink-3); }
  .textbtn:hover { text-decoration-color: var(--ink); }
  .seg { display: inline-flex; background: var(--track); border-radius: 7px; padding: 2px; gap: 2px; }
  .seg button { padding: 3px 9px; border-radius: 5px; font-size: 12px; color: var(--ink-2); }
  .seg button[aria-pressed="true"] { background: var(--paper-2); color: var(--ink); font-weight: 500; box-shadow: 0 1px 2px rgba(0,0,0,.12); }
  .empty { padding: 10px 14px 14px; color: var(--ink-2); }

  /* overlay panel (credits, info) inside a surface */
  .overlay { position: absolute; inset: 0; background: var(--paper); z-index: 5; display: flex; flex-direction: column; }
  .overlay .ohdr { display: flex; align-items: center; gap: 10px; padding: 12px 14px 8px; border-bottom: 1px solid var(--rule); }
  .phone .overlay .ohdr { padding: 58px 20px 10px; }
  .overlay .ohdr h2 { font-size: 14px; margin: 0; font-weight: 600; flex: 1; }
  .overlay .obody { padding: 10px 14px 14px; overflow: auto; font-size: 12.5px; }
  .phone .overlay .obody { padding: 12px 20px 30px; font-size: 14px; }
  .overlay p { margin: 0 0 8px; color: var(--ink-2); }
  .credit { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--rule); }
  .credit .when { flex: 1; }
  .credit .when b { display: block; font-weight: 500; color: var(--ink); }
  .credit .when span { color: var(--ink-2); font-size: 12px; }
  .btn { padding: 5px 12px; border-radius: 7px; border: 1px solid var(--rule); background: var(--paper-2); font-size: 12.5px; font-weight: 500; }
  .btn:hover { background: var(--hover); }
  .btn.primary { background: var(--accent); color: var(--on-accent); border-color: transparent; }
  .btn[disabled] { opacity: .45; cursor: default; }
  .confirm { margin: 8px 0 2px; padding: 10px 12px; background: var(--paper-2); border: 1px solid var(--rule); border-radius: 8px; }
  .confirm p { color: var(--ink); margin-bottom: 8px; }
  .confirm .row { display: flex; gap: 8px; justify-content: flex-end; }
  .outcome { margin-top: 10px; padding: 10px 12px; border-radius: 8px; background: var(--paper-2); border: 1px solid var(--rule); color: var(--ink); }
  .outcome.warn { background: var(--warn-bg); }
  .outcome .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 8px; }

  /* trend */
  .trend { display: grid; grid-template-columns: repeat(30, 1fr); gap: 2px; align-items: end; height: 34px; }
  .trend i { display: block; background: var(--ink-3); border-radius: 1px 1px 0 0; min-height: 1px; }
  .trend i.in { background: var(--ink); }
  .trend-axis { display: flex; justify-content: space-between; font-size: 10.5px; color: var(--ink-3); margin-top: 3px; }

  /* ---------- Variant A: Ledger ---------- */
  .A .acct { display: grid; grid-template-columns: 3px 1fr; margin: 0 14px 8px; gap: 0 10px; }
  .phone .A .acct { margin: 0 20px 10px; }
  .A .acct .spine { border-radius: 2px; }
  .A .acct .top { display: flex; align-items: baseline; gap: 6px; padding: 2px 0 2px; cursor: pointer; }
  .A .acct .top:hover .name { text-decoration: underline; text-decoration-color: var(--ink-3); text-underline-offset: 2px; }
  .A .acct .name { font-weight: 600; }
  .A .acct .plan { color: var(--ink-2); font-size: 12px; }
  .A .acct .top .right { margin-left: auto; display: flex; gap: 6px; align-items: center; }
  .A .win { display: grid; grid-template-columns: 7.2em 1fr 3.6em; gap: 0 10px; align-items: center; padding: 3px 0; }
  .phone .A .win { grid-template-columns: 7.6em 1fr 3.8em; padding: 4px 0; }
  .A .win .lbl { color: var(--ink-2); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .A .win .pct { text-align: right; font-weight: 500; }
  .A .win .reset { grid-column: 2 / 4; font-size: 11.5px; color: var(--ink-3); margin-top: -1px; }
  .phone .A .win .reset { font-size: 12px; }
  .A .acct .foot { display: flex; gap: 6px; flex-wrap: wrap; padding: 4px 0 2px; }
  .A .act .totals { display: grid; grid-template-columns: auto 1fr; padding: 6px 14px 4px; gap: 16px; }
  .phone .A .act .totals { padding: 6px 20px 4px; }
  .A .act .totals .num { font-size: 20px; font-weight: 600; letter-spacing: -.02em; line-height: 1.1; }
  .A .act .totals .num small { display: block; font-size: 11.5px; font-weight: 400; color: var(--ink-2); letter-spacing: 0; margin-top: 2px; }
  .A .act .trendwrap { padding: 4px 14px 2px; }
  .phone .A .act .trendwrap { padding: 4px 20px 2px; }
  .A .prow { display: grid; grid-template-columns: 1fr auto auto; gap: 0 12px; padding: 5px 14px; align-items: baseline; cursor: pointer; }
  .phone .A .prow { padding: 7px 20px; }
  .A .prow:hover { background: var(--hover); }
  .A .prow .pn { display: flex; align-items: center; gap: 6px; }
  .A .prow .pn svg { width: 11px; height: 11px; }
  .A .prow .t, .A .prow .c { color: var(--ink-2); font-size: 12px; }
  .A .mrow { display: grid; grid-template-columns: 1fr auto auto; gap: 0 12px; padding: 3px 14px 3px 31px; font-size: 12px; color: var(--ink-2); }
  .phone .A .mrow { padding: 4px 20px 4px 37px; }
  .A .mrow .note { grid-column: 1 / 4; color: var(--ink-3); font-size: 11.5px; }

  /* ---------- Variant B: Cards ---------- */
  .B .card { margin: 0 12px 10px; background: var(--paper-2); border-radius: var(--radius); box-shadow: 0 0 0 .5px var(--rule); overflow: hidden; }
  .phone .B .card { margin: 0 16px 12px; border-radius: 14px; }
  .B .card .chead { display: flex; align-items: center; gap: 8px; padding: 10px 12px 0; cursor: pointer; }
  .B .card .chead .name { font-weight: 600; }
  .B .card .chead .plan { color: var(--ink-2); font-size: 12px; }
  .B .card .chead .right { margin-left: auto; display: flex; gap: 6px; align-items: center; }
  .B .hero { display: flex; align-items: baseline; gap: 8px; padding: 6px 12px 0; }
  .B .hero .n { font-size: 30px; font-weight: 600; letter-spacing: -.03em; line-height: 1; }
  .phone .B .hero .n { font-size: 36px; }
  .B .hero .l { color: var(--ink-2); font-size: 12px; }
  .B .hero .r { margin-left: auto; color: var(--ink-3); font-size: 12px; text-align: right; }
  .B .hero-bar { margin: 8px 12px 0; }
  .B .others { padding: 8px 12px 10px; display: grid; gap: 6px; }
  .B .owin { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; font-size: 12px; }
  .B .owin .lbl { color: var(--ink-2); }
  .B .owin .pct { font-weight: 500; text-align: right; }
  .B .owin .bar { grid-column: 1 / 3; }
  .B .owin .reset { grid-column: 1 / 3; color: var(--ink-3); font-size: 11.5px; }
  .B .cfoot { display: flex; gap: 6px; flex-wrap: wrap; padding: 0 12px 10px; }
  .B .card .details { padding: 0 12px 10px; }
  .B .act .totals { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 8px 12px 4px; }
  .B .act .totals > div { display: flex; flex-direction: column; justify-content: flex-end; }
  .B .act .totals .k { color: var(--ink-2); font-size: 12px; }
  .B .act .totals .v { font-size: 22px; font-weight: 600; letter-spacing: -.02em; }
  .B .act .totals .v small { font-size: 12px; font-weight: 400; color: var(--ink-2); letter-spacing: 0; }
  .B .act .trendwrap { padding: 8px 12px 4px; }
  .B .act .trend { height: 48px; }
  .B .ppill { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-top: 1px solid var(--rule); cursor: pointer; }
  .B .ppill:hover { background: var(--hover); }
  .B .ppill svg { width: 12px; height: 12px; }
  .B .ppill .t { margin-left: auto; color: var(--ink-2); font-size: 12px; }
  .B .ppill .c { color: var(--ink); font-size: 12px; min-width: 6em; text-align: right; }
  .B .mrow { display: grid; grid-template-columns: 1fr auto auto; gap: 0 10px; padding: 4px 12px 4px 32px; font-size: 12px; color: var(--ink-2); }
  .B .mrow .note { grid-column: 1 / 4; color: var(--ink-3); font-size: 11.5px; }

  /* ---------- Variant C: Table ---------- */
  .C table { width: 100%; border-collapse: collapse; font-size: 12.5px; table-layout: fixed; }
  .C th.c-account { width: 31%; } .C th.c-window { width: 21%; } .C th.c-rem { width: 30%; } .C th.c-reset { width: 18%; }
  .phone .C th.c-account { width: 36%; } .phone .C th.c-window { width: 30%; } .phone .C th.c-rem { width: 34%; }
  .C th { text-align: left; font-weight: 500; color: var(--ink-3); font-size: 11.5px; padding: 6px 8px 4px; border-bottom: 1px solid var(--rule); }
  .C th:first-child { padding-left: 14px; }
  .C td { padding: 4px 8px; vertical-align: middle; border-bottom: 1px solid var(--rule); }
  .C td:first-child { padding-left: 11px; border-left: 3px solid transparent; }
  .C tr.first td { padding-top: 7px; }
  .C tr.last td { padding-bottom: 7px; }
  .C td.acct { font-weight: 600; cursor: pointer; overflow-wrap: anywhere; }
  .C td.acct .chip { margin-top: 3px; }
  .C td.acct .plan { display: block; font-weight: 400; color: var(--ink-2); font-size: 11.5px; }
  .C td.win { color: var(--ink-2); white-space: nowrap; }
  .C td.rem { width: 34%; }
  .C td.rem .row { display: flex; align-items: center; gap: 8px; }
  .C td.rem .bar { flex: 1; min-width: 40px; }
  .C td.rem .pct { font-weight: 500; min-width: 3.4ch; text-align: right; }
  .C td.reset { color: var(--ink-2); font-size: 12px; text-align: right; padding-right: 14px; }
  .C td.win .under { display: none; }
  .phone .C th.c-reset, .phone .C td.reset { display: none; }
  .phone .C td.win .under { display: block; color: var(--ink-3); font-size: 11.5px; white-space: normal; }
  .phone .C td.win { white-space: normal; }
  .C tr.detail td { padding: 0 14px 10px 14px; }
  .C tr.detail .details { padding: 4px 0 0; }
  .C tr.foot td { padding: 2px 8px 8px 14px; }
  .C .act table td { border-bottom: 1px solid var(--rule); }
  .C .act tr.prow { cursor: pointer; }
  .C .act tr.prow:hover td { background: var(--hover); }
  .C .act tr.mrow td { color: var(--ink-2); font-size: 12px; padding-left: 28px; }
  .C .act td.n, .C .act th.n { text-align: right; }
  .C .act .trendwrap { padding: 8px 14px 4px; }
  .C .act .totals { padding: 6px 14px 2px; display: flex; gap: 18px; align-items: baseline; }
  .C .act .totals b { font-size: 16px; font-weight: 600; }
  .C .act .totals span { color: var(--ink-2); font-size: 12px; }
  .phone .C .section-title, .phone .C .act .totals, .phone .C .act .trendwrap { padding-left: 16px; padding-right: 16px; }

const fmtTok = n => n >= 1e6 ? (n / 1e6).toFixed(n >= 10e6 ? 1 : 2) + 'M' : n >= 1e3 ? Math.round(n / 1e3) + 'k' : String(n);
const fmtUsd = n => '$' + n.toFixed(2);
const fmtRange = (lo, hi) => lo === hi ? fmtUsd(lo) : `${fmtUsd(lo)}\u2013${hi.toFixed(2)}`;
function pacing(w) {
  if (w.duration == null) return { ok: false, reason: 'Window duration unknown' };
  if (w.resetsAt == null || w.resetsAt < NOW) return { ok: false, reason: 'Reset time missing or passed' };
  const used = 100 - w.remaining; if (used <= 0) return { ok: false, reason: 'No usage in this window yet' };
  const start = w.resetsAt - w.duration, elapsed = NOW - start;
  if (elapsed < Math.max(60e3, w.duration * .01)) return { ok: false, reason: 'Not enough of the window has elapsed' };
  const projected = used / elapsed * w.duration;
  const out = { ok: true, projected: Math.round(projected), spare: Math.round(100 - projected) };
  if (projected > 100) out.runOut = start + elapsed * (100 / used);
  return out;
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// ---------- shared renderers ----------
// Account identity in the apps: the provider logo tinted with the account color, matching its pin.
function swatch(a, mode) { return `<span class="acct-logo" style="color:${color(a.idx, mode)}" title="${PROVIDERS[a.provider].name}">${PROVIDERS[a.provider].glyph}</span>`; }
function warnmark(text) { return `<span class="warnmark" title="${esc(text)}">${WARN}<span class="muted" style="font-size:11.5px">${esc(text)}</span></span>`; }
function accountBadges(a) {
  const out = [];
  if (a.stale) out.push(a.observed ? warnmark(`Stale ${rel(NOW - a.observed)}`) : warnmark('No reading'));
  if (a.unknownOutcome) out.push(`<button class="chip warn" data-act="unknown" data-id="${a.id}">${WARN} Reset outcome unknown</button>`);
  return out.join('');
}
function footChips(a) {
  const out = [];
  if (a.credits) out.push(`<button class="chip action" data-act="credits" data-id="${a.id}" title="Reset credits for ${esc(a.name)}">${a.credits.available} reset ${a.credits.available === 1 ? 'credit' : 'credits'}</button>`);
  return out.join('');
}
// Spend and balance rows shown without expanding: extra-usage caps get a remaining bar; balances and "off" are one line.
function spendRows(a) {
  const rows = [];
  if (a.spend) {
    const sp = a.spend;
    if (sp.off) rows.push(`<div class="owin"><span class="lbl">${esc(sp.label)}</span><span class="pct muted">Off</span></div>`);
    // The provider only sometimes reports a limit (the spike saw monthly_limit: null); without one, show used alone, no fraction or bar.
    else if (sp.cap == null) rows.push(`<div class="owin"><span class="lbl">${esc(sp.label)}</span><span class="pct">${fmtUsd(sp.used)} spent ${esc(sp.period)}</span></div>`);
    else { const left = Math.max(0, sp.cap - sp.used), pct = left / sp.cap * 100;
      rows.push(`<div class="owin"><span class="lbl">${esc(sp.label)}</span><span class="pct">${fmtUsd(left)} of ${fmtUsd(sp.cap)} left</span><div class="bar"><i style="width:${pct}%"></i></div><span class="reset">${fmtUsd(sp.used)} spent ${esc(sp.period)}</span></div>`); }
  }
  if (a.balance) rows.push(`<div class="owin"><span class="lbl">Credits</span><span class="pct">${esc(a.balance)}</span></div>`);
  return rows.join('');
}
function detailsBlock(a) {
  const rows = [];
  rows.push(['Observed', a.observed ? `${fmtTime(a.observed)}, ${rel(NOW - a.observed)} ago` : 'Never']);
  if (a.error) rows.push(['Error', a.error]);
  a.extras.forEach(([k, v]) => rows.push([k, v]));
  if (a.spend) rows.push([a.spend.label, a.spend.off ? 'Off' : a.spend.cap == null ? `${fmtUsd(a.spend.used)} used ${a.spend.period}; no limit reported` : `${fmtUsd(a.spend.used)} of a ${fmtUsd(a.spend.cap)} limit used ${a.spend.period}`]);
  if (a.credits) rows.push(['Reset credits', `${a.credits.available} available; provider reports ${a.credits.applicable} applicable now`]);
  rows.push(['Times shown in', TZ]);
  let html = `<div class="details"><dl>${rows.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl>`;
  a.windows.forEach(w => {
    const p = pacing(w);
    html += `<div class="sub">${esc(w.label)}, ${durText(w)}</div><dl>
      ${w.note ? `<dt>Scope</dt><dd>${esc(w.note)}</dd>` : ''}
      <dt>Used</dt><dd>${100 - w.remaining}%</dd>
      <dt>Resets</dt><dd>${w.resetsAt ? esc(fmtAbs(w.resetsAt)) : 'Unknown'}${w.resetsAt && w.resetsAt < NOW ? '; passed, awaiting update' : ''}</dd>
      ${p.ok ? `<dt>Projected at reset</dt><dd>${p.projected}% used, ${p.spare >= 0 ? p.spare + '% spare' : 'over by ' + (-p.spare) + '%'}</dd>${p.runOut ? `<dt>Runs out</dt><dd>${esc(fmtAbs(p.runOut))}</dd>` : ''}` : `<dt>Pacing</dt><dd>${esc(p.reason)}</dd>`}
    </dl>`;
  });
  return html + '</div>';
}
function trendBlock() {
  const t = ACTIVITY.trend, max = Math.max(...t);
  const inRange = i => UI.range === 'today' ? i === 29 : UI.range === 'yesterday' ? i === 28 : true;
  return `<div class="trendwrap"><div class="trend" role="img" aria-label="Daily token trend, last 30 days">${t.map((v, i) => `<i class="${inRange(i) ? 'in' : ''}" style="height:${Math.max(3, v / max * 100)}%" title="${fmtTok(v * 1000)} tokens"></i>`).join('')}</div>
  <div class="trend-axis"><span>Aug 9</span><span>Aug 24</span><span>Today</span></div></div>`;
}
function activityHeader(title = 'Recorded OpenCode activity') {

    <span style="margin-left:auto" class="seg" role="group" aria-label="Range">
      ${[['today', 'Today'], ['yesterday', 'Yesterday'], ['last30', '30 days']].map(([k, l]) => `<button data-act="range" data-range="${k}" aria-pressed="${UI.range === k}">${l}</button>`).join('')}</span></div>

}
function activityData() { return ACTIVITY[UI.range]; }
function pricedStatus(d) {
  const unpriced = d.providers.some(p => p.models.some(m => m.status === 'unpriced'));

function providerCost(p) { return p.status === 'none' ? 'No recorded activity' : p.models.some(m => m.status === 'unpriced') ? fmtRange(p.low, p.high) + ' partial' : fmtRange(p.low, p.high); }

// ---------- overlays ----------

// Pinned first in saved order, then other accounts grouped by provider and sorted by OpenCode name.

// ---------- menu bar ----------
function pinsHTML(accounts, mode) {
  const pinned = accounts.filter(a => a.pinned);
  if (!pinned.length) return `<span class="pin tally-only" data-tip="Tally">${TALLY_GLYPH}</span>`;
  return pinned.map(a => {
    const lines = pinLines(a), c = color(a.idx, mode);
    const tip = lines.length ? `${a.name} (${PROVIDERS[a.provider].name}): ${lines.map(w => `${w.label.toLowerCase()} ${w.remaining}% remaining`).join(', ')}${a.stale ? `. Stale, last reading ${rel(NOW - a.observed)} ago` : ''}`
                  : `${a.name} (${PROVIDERS[a.provider].name}): no reading${a.error ? '. ' + a.error : ''}`;
    const pct = lines.length === 0 ? '<span class="pct unknown">?</span>'
      : lines.length === 1 ? `<span class="pct">${lines[0].remaining}%</span>`
      : `<span class="pct stack">${lines.map(w => `<span>${w.remaining}%</span>`).join('')}</span>`;
    return `<span class="pin" data-tip="${esc(tip)}" tabindex="0">
      ${S.pin === 'dot' ? `<span class="id-dot" style="background:${c}"></span>` : ''}
      <span class="logo" style="${S.pin === 'tint' ? 'color:' + c : ''}">${PROVIDERS[a.provider].glyph}</span>
      ${pct}
      ${a.stale ? `<span class="warn" aria-label="stale">${WARN}</span>` : ''}
      ${S.pin === 'underline' ? `<span class="id-underline" style="background:${c}"></span>` : ''}
    </span>`;
  }).join('');
}
function menubarHTML(accounts, mode) {
  return `<div class="menubar ${mode}"><div class="pins">${pinsHTML(accounts, mode)}</div><div class="sys"><span>Mon Sep 7</span><span>11:20 AM</span></div></div>`;
}

// ---------- render ----------
function render() {
  const accounts = buildAccounts();
  const mode = S.appearance, V = VARIANTS[S.variant];
  const hdr = (big) => `<div class="hdr"><h1>Tally</h1><div class="meta"><span>Updated ${rel(NOW - Math.max(...accounts.filter(a => a.observed).map(a => a.observed)))} ago</span><button data-act="refresh">Refresh</button></div></div>`;
  document.getElementById('stage').innerHTML = `
    <p class="stage-note">Variant <b>${S.variant}, ${V.name}</b>. Both menu bars always render so the identity palette can be judged on light and dark. Hover a pin for its tooltip. Click an account to expand details; click a reset-credit chip to walk the redemption flow.</p>
    <div class="menubars">${menubarHTML(accounts, 'light')}${menubarHTML(accounts, 'dark')}</div>
    <div class="surfaces">
      <div><p class="surface-label">Menu bar popover, ${V.wide ? 440 : 360}px${S.clip === 'clip' ? ', scrolls at 720px' : ''}</p>
        <div class="popover ${mode} ${V.wide ? 'wide' : ''} ${S.clip === 'clip' ? 'clipped' : ''}" id="popover">${hdr()}<div class="body">${stacked(V, accounts, mode)}</div>${overlayHTML(accounts)}</div></div>
      <div><p class="surface-label">Mobile web over the tailnet, ${S.phone}px</p>
        <div class="phone ${mode} ${S.phone === '320' ? 'narrow' : ''}" id="phone"><div class="statusbar"><span>11:20</span></div><div class="body">${hdr(true)}${stacked(V, accounts, mode)}</div>${overlayHTML(accounts)}<div class="home"></div></div></div>
    </div>
    <p class="surface-label" style="margin-top:36px">Desktop web over the tailnet, browser window</p>
    <div class="browser ${mode}" id="desktop"><div class="chrome"><span></span><span></span><span></span><div class="url"></div></div><div class="page">${hdr()}${desktop(V, accounts, mode)}</div>${overlayHTML(accounts)}</div>`;
  renderChrome();
}

function renderChrome() {
  const grp = (label, key, opts) => `<div class="grp"><span>${label}</span><div class="opts">${opts.map(([v, l]) => `<button data-k="${key}" data-v="${v}" aria-pressed="${S[key] === v}">${l}</button>`).join('')}</div></div>`;
  const pal = PALETTES[S.palette];
  document.getElementById('proto-controls').innerHTML = `<h3>Prototype controls (not part of the design)</h3>
    ${grp('Popover and phone appearance', 'appearance', [['light', 'Light'], ['dark', 'Dark']])}
    ${grp('Menu bar', 'bar', [['three', '3 pins'], ['normal', '7 pins'], ['crowded', '14 pins'], ['nopins', 'No pins']])}
    ${grp('Data state', 'state', [['healthy', 'Healthy'], ['degraded', 'Degraded']])}
    ${grp('Identity palette', 'palette', Object.entries(PALETTES).map(([k, p]) => [k, p.name]))}
    <div class="legend">${pal.light.map((c, i) => `<div title="${pal.names[i]}"><i style="background:${c}"></i><i style="background:${pal.dark[i]}"></i></div>`).join('')}</div>
    <div class="legend-names">${pal.names.map(n => `<span>${n}</span>`).join('')}</div>
    ${grp('Pin identity mark', 'pin', [['tint', 'Tinted logo'], ['underline', 'Underline'], ['dot', 'Dot']])}
    ${grp('Popover height', 'clip', [['all', 'Show everything'], ['clip', 'Scroll at 720px']])}
    ${grp('Phone width', 'phone', [['390', '390'], ['320', '320']])}`;
  const keys = Object.keys(VARIANTS), i = keys.indexOf(S.variant);
  document.getElementById('proto-switcher').innerHTML = `<button data-cycle="-1" aria-label="Previous variant">&larr;</button><div><b>${S.variant}</b> <span>(${VARIANTS[S.variant].name})</span></div><button data-cycle="1" aria-label="Next variant">&rarr;</button>`;
}

// ---------- events ----------
document.addEventListener('click', e => {
  const ctl = e.target.closest('#proto-controls button'); if (ctl) { setParam(ctl.dataset.k, ctl.dataset.v); return; }
  const cyc = e.target.closest('#proto-switcher button'); if (cyc) { cycle(+cyc.dataset.cycle); return; }
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act, id = el.dataset.id;
  if (act === 'toggle') { UI.expanded.has(id) ? UI.expanded.delete(id) : UI.expanded.add(id); }
  else if (act === 'range') { UI.range = el.dataset.range; }
  else if (act === 'prov') { const p = el.dataset.p; UI.openProviders.has(p) ? UI.openProviders.delete(p) : UI.openProviders.add(p); }
  else if (act === 'info') { UI.overlay = { type: 'info' }; }
  else if (act === 'credits') { UI.overlay = { type: 'credits', id }; }
  else if (act === 'unknown') { UI.overlay = { type: 'unknown', id }; }
  else if (act === 'close') { UI.overlay = null; }
  else if (act === 'use') { UI.credits[id].confirming = el.dataset.credit; }
  else if (act === 'cancel') { UI.credits[id].confirming = null; }
  else if (act === 'confirm') {
    const c = UI.credits[id]; c.confirming = null; c.pending = el.dataset.credit;
    setTimeout(() => {
      c.pending = null;
      c.outcome = S.state === 'degraded'
        ? { id: el.dataset.credit, kind: 'unknown', text: 'Outcome unknown. The request was sent but no answer arrived within 15 seconds. Tally will not resend it. Check remaining allowance and credit count before trying again.' }
        : { id: el.dataset.credit, kind: 'ok', text: 'Reset applied: 2 windows reset. Credit consumed; 1 remains. Fresh usage will show after the next reading.' };
      render();
    }, 1500);
  }
  else if (act === 'ack') { UI.credits[id].outcome = null; UI.overlay = null; }
  else if (act === 'ackAccount') { UI.acked = true; UI.overlay = null; }
  else if (act === 'refresh') { /* no-op in prototype */ }
  render();
});
document.addEventListener('keydown', e => {
  const t = e.target; if (t.matches('input, textarea, [contenteditable]')) return;
  if (e.key === 'ArrowLeft') cycle(-1); else if (e.key === 'ArrowRight') cycle(1);
  else if ((e.key === 'Enter' || e.key === ' ') && t.dataset && t.dataset.act === 'toggle') { e.preventDefault(); t.click(); }
});
function cycle(d) { const keys = Object.keys(VARIANTS); setParam('variant', keys[(keys.indexOf(S.variant) + d + keys.length) % keys.length]); }

// pin tooltips
const tip = document.getElementById('tip');
document.addEventListener('mouseover', e => { const p = e.target.closest('[data-tip]'); if (!p) { tip.style.display = 'none'; return; } tip.textContent = p.dataset.tip; tip.style.display = 'block'; const r = p.getBoundingClientRect(); tip.style.left = Math.min(r.left, innerWidth - 340) + 'px'; tip.style.top = (r.bottom + 6) + 'px'; });

render();
</script>
</body>
</html>
